name: Kontrola sestavení webu

# Po každém pushi na main se web jen SESTAVÍ (kontrola, že je vše v pořádku).
# Nasazení na Forpsi se dělá ručně přes Web FTP (Forpsi nepouští FTP z GitHubu / zahraničních serverů).
# Až Forpsi FTP ze zahraničí povolí, dá se sem vrátit krok „FTP-Deploy-Action" a nasazovat automaticky.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení kódu
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Sestavení webu
        run: npm run build
